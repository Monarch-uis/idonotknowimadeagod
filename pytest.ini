[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Paths
testpaths = tests
pythonpath = .

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
#    --cov=core
#    --cov=features
#    --cov-report=html:htmlcov
#    --cov-report=term-missing
#    --cov-fail-under=70

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_ffmpeg: marks tests that require FFmpeg
    requires_network: marks tests that require network access

# Logging
log_cli = false
log_cli_level = INFO
log_file = logs/pytest.log
log_file_level = DEBUG

# Coverage
[coverage:run]
source = core,features
omit = 
    */tests/*
    */__pycache__/*
    */site-packages/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
